spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 替换为你的数据库名、用户名、密码
    url: jdbc:mysql://localhost:3306/govservice?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    username: root
    password: qaz123456
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
          ddl-auto: none
          show-sql: false

mybatis:
  mapper-locations: classpath:mybatis/**/*.xml  # MyBatis映射文件路径
  type-aliases-package: com.example.govservice.entity  # 实体类所在包路径
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名转换

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# 日志配置
logging:
  level:
    com.example.govservice.mapper: debug  # 打印SQL语句
    root: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 开发环境配置
